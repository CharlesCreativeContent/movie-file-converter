<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Editor — Movie File Converter</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-h: #1d4ed8;
      --success: #059669;
      --error: #dc2626;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827; --surface: #1f2937; --border: #374151;
        --text: #f9fafb; --muted: #9ca3af;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }

    nav {
      display: flex;
      gap: 4px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .nav-link.active { background: var(--accent); color: #fff; }
    .nav-link:hover:not(.active) { background: var(--border); color: var(--text); }

    main {
      max-width: 580px;
      margin: 36px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 1.55rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 2px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .hidden { display: none !important; }

    .drop-zone {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    }
    .drop-zone-icon { color: var(--muted); margin-bottom: 10px; }
    .drop-main { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .drop-sub { color: var(--muted); font-size: 14px; }
    .drop-formats { color: var(--muted); font-size: 12px; letter-spacing: 0.05em; margin-top: 10px; }
    .link-btn {
      color: var(--accent);
      cursor: pointer;
      font: inherit;
      background: none;
      border: none;
      padding: 0;
      font-size: 14px;
    }
    .link-btn:hover { text-decoration: underline; }

    .file-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .file-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .group-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 10px;
      margin-top: 18px;
    }
    .group-label:first-of-type { margin-top: 14px; }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .radio-option { position: relative; }
    .radio-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .radio-option label {
      display: inline-flex;
      align-items: center;
      padding: 7px 16px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.12s, background 0.12s, color 0.12s;
      user-select: none;
    }
    .radio-option input[type="radio"]:checked + label {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      color: var(--accent);
    }
    .radio-option label:hover {
      border-color: var(--accent);
    }

    .estimate {
      font-size: 13px;
      color: var(--muted);
      margin-top: 14px;
      min-height: 1.4em;
    }
    .estimate strong { color: var(--text); }

    .no-change-hint {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      font-style: italic;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px 18px;
      border-radius: 7px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, background 0.15s;
      margin-top: 18px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost { background: var(--border); color: var(--text); }
    .btn-ghost:hover { opacity: 0.8; }
    .btn-success { background: var(--success); color: #fff; text-decoration: none; }
    .btn-success:hover { opacity: 0.9; }

    .progress-label { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
    .progress-track { height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.25s; width: 0%; }
    .progress-fill.indeterminate {
      width: 35% !important;
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-200%); }
      100% { transform: translateX(450%); }
    }

    .success-label { color: var(--success); font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .error-label { color: var(--error); font-size: 14px; margin-bottom: 12px; word-break: break-word; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-link">Convert</a>
    <a href="speed.html" class="nav-link active">Speed Editor</a>
  </nav>

  <main>
    <div>
      <h1>Speed Editor</h1>
      <p class="subtitle">Change playback speed and loop count — processed locally in your browser</p>
    </div>

    <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Drop video file or click to select">
      <div class="drop-zone-icon">
        <svg width="42" height="42" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 010 1.972l-11.54 6.347a1.125 1.125 0 01-1.667-.986V5.653z"/>
        </svg>
      </div>
      <p class="drop-main">Drop your video here</p>
      <p class="drop-sub">or <button type="button" class="link-btn" id="browse-btn">browse files</button></p>
      <p class="drop-formats">MP4 · MOV · AVI · MKV · WebM</p>
      <input type="file" id="file-input" accept="video/*,.mov,.avi,.mkv,.webm" style="display:none">
    </div>

    <div id="edit-section" class="card hidden">
      <div class="file-meta">
        <span class="file-name" id="file-name"></span>
        <span class="file-size" id="file-size"></span>
      </div>

      <p class="group-label">Playback Speed</p>
      <div class="radio-group" id="speed-group">
        <div class="radio-option"><input type="radio" name="speed" id="s025" value="0.25"><label for="s025">0.25×</label></div>
        <div class="radio-option"><input type="radio" name="speed" id="s050" value="0.5"><label for="s050">0.5×</label></div>
        <div class="radio-option"><input type="radio" name="speed" id="s100" value="1" checked><label for="s100">1× (original)</label></div>
        <div class="radio-option"><input type="radio" name="speed" id="s150" value="1.5"><label for="s150">1.5×</label></div>
        <div class="radio-option"><input type="radio" name="speed" id="s200" value="2"><label for="s200">2×</label></div>
        <div class="radio-option"><input type="radio" name="speed" id="s400" value="4"><label for="s400">4×</label></div>
      </div>

      <p class="group-label">Loop</p>
      <div class="radio-group" id="loop-group">
        <div class="radio-option"><input type="radio" name="loops" id="l1" value="1" checked><label for="l1">Play once</label></div>
        <div class="radio-option"><input type="radio" name="loops" id="l2" value="2"><label for="l2">2×</label></div>
        <div class="radio-option"><input type="radio" name="loops" id="l3" value="3"><label for="l3">3×</label></div>
        <div class="radio-option"><input type="radio" name="loops" id="l5" value="5"><label for="l5">5×</label></div>
      </div>

      <p class="estimate" id="estimate"></p>
      <p class="no-change-hint hidden" id="no-change-hint">Select a different speed or loop count to process</p>

      <button type="button" class="btn btn-primary" id="process-btn">Process</button>
    </div>

    <div id="progress-section" class="card hidden">
      <p class="progress-label" id="progress-label">Preparing…</p>
      <div class="progress-track">
        <div class="progress-fill indeterminate" id="progress-fill"></div>
      </div>
    </div>

    <div id="result-section" class="card hidden">
      <p class="success-label">Done</p>
      <a id="download-link" href="#" class="btn btn-success" download>Download</a>
    </div>

    <div id="error-section" class="card hidden">
      <p class="error-label" id="error-msg"></p>
      <button type="button" class="btn btn-ghost" id="retry-btn">Start over</button>
    </div>
  </main>

  <script type="module">
    import { getExtFromFile, getSpeedArgs } from './lib/formats.js';

    const SUPPORTED = new Set(['mp4', 'mov', 'avi', 'mkv', 'webm']);

    let selectedFile = null;
    let inputDuration = null;
    let ffmpegInstance = null;

    const $ = id => document.getElementById(id);
    const dropZone        = $('drop-zone');
    const fileInput       = $('file-input');
    const browseBtn       = $('browse-btn');
    const editSection     = $('edit-section');
    const fileNameEl      = $('file-name');
    const fileSizeEl      = $('file-size');
    const processBtnEl    = $('process-btn');
    const estimateEl      = $('estimate');
    const noChangeHint    = $('no-change-hint');
    const progressSection = $('progress-section');
    const progressLabel   = $('progress-label');
    const progressFill    = $('progress-fill');
    const resultSection   = $('result-section');
    const downloadLink    = $('download-link');
    const errorSection    = $('error-section');
    const errorMsg        = $('error-msg');
    const retryBtn        = $('retry-btn');

    const sections = [editSection, progressSection, resultSection, errorSection];

    function show(section) {
      sections.forEach(s => s.classList.add('hidden'));
      section?.classList.remove('hidden');
    }

    function fmtBytes(b) {
      if (b < 1024 ** 2) return `${(b / 1024).toFixed(0)} KB`;
      if (b < 1024 ** 3) return `${(b / 1024 ** 2).toFixed(1)} MB`;
      return `${(b / 1024 ** 3).toFixed(1)} GB`;
    }

    function fmtDuration(s) {
      if (!isFinite(s) || s <= 0) return '—';
      const m = Math.floor(s / 60);
      const sec = (s % 60).toFixed(1);
      return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
    }

    function getSpeed() { return parseFloat(document.querySelector('input[name="speed"]:checked').value); }
    function getLoops() { return parseInt(document.querySelector('input[name="loops"]:checked').value, 10); }

    function updateUI() {
      const speed = getSpeed();
      const loops = getLoops();
      const noChange = speed === 1 && loops === 1;

      processBtnEl.disabled = noChange;
      noChangeHint.classList.toggle('hidden', !noChange);

      if (inputDuration != null && !noChange) {
        const outDur = inputDuration * loops / speed;
        estimateEl.innerHTML = `Estimated output duration: <strong>${fmtDuration(outDur)}</strong>`;
      } else {
        estimateEl.textContent = '';
      }
    }

    document.querySelectorAll('input[name="speed"], input[name="loops"]')
      .forEach(el => el.addEventListener('change', updateUI));

    function handleFile(file) {
      if (!file) return;

      const ext = file.name.toLowerCase().split('.').pop();
      if (!SUPPORTED.has(ext) && !file.type.startsWith('video/')) {
        showError(`Unsupported format. Supported: ${[...SUPPORTED].join(', ').toUpperCase()}`);
        return;
      }

      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = fmtBytes(file.size);
      inputDuration = null;

      // Probe duration via browser media element
      const url = URL.createObjectURL(file);
      const vid = document.createElement('video');
      vid.preload = 'metadata';
      vid.addEventListener('loadedmetadata', () => {
        inputDuration = vid.duration;
        URL.revokeObjectURL(url);
        updateUI();
      }, { once: true });
      vid.addEventListener('error', () => URL.revokeObjectURL(url), { once: true });
      vid.src = url;

      updateUI();
      show(editSection);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      show(errorSection);
    }

    // Drag and drop
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', e => { if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over'); });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      handleFile(e.dataTransfer.files[0]);
    });
    dropZone.addEventListener('click', () => fileInput.click());
    browseBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));
    dropZone.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });

    retryBtn.addEventListener('click', () => {
      selectedFile = null;
      inputDuration = null;
      fileInput.value = '';
      document.querySelector('#s100').checked = true;
      document.querySelector('#l1').checked = true;
      show(null);
    });

    async function loadFFmpeg() {
      if (ffmpegInstance) return ffmpegInstance;

      const { FFmpeg } = await import('https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js');
      const { toBlobURL } = await import('https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js');

      const useMT = typeof SharedArrayBuffer !== 'undefined';
      const pkg = useMT ? '@ffmpeg/core-mt@0.12.6' : '@ffmpeg/core@0.12.6';
      const base = `https://unpkg.com/${pkg}/dist/esm`;

      const ffmpeg = new FFmpeg();
      const loadOpts = {
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
      };
      if (useMT) {
        loadOpts.workerURL = await toBlobURL(`${base}/ffmpeg-core.worker.js`, 'text/javascript');
      }

      await ffmpeg.load(loadOpts);
      ffmpegInstance = ffmpeg;
      return ffmpeg;
    }

    processBtnEl.addEventListener('click', async () => {
      if (!selectedFile) return;

      const speed = getSpeed();
      const loops = getLoops();
      if (speed === 1 && loops === 1) return;

      const ext = selectedFile.name.toLowerCase().split('.').pop();
      const inputName = `input.${ext}`;
      const outputName = 'output.mp4';

      const speedTag = speed !== 1 ? `_${speed}x` : '';
      const loopTag = loops > 1 ? `_loop${loops}` : '';
      const downloadName = `${selectedFile.name.replace(/\.[^.]+$/, '')}${speedTag}${loopTag}.mp4`;

      show(progressSection);
      const logs = [];

      try {
        progressLabel.textContent = 'Loading FFmpeg engine…';
        progressFill.className = 'progress-fill indeterminate';

        const ffmpeg = await loadFFmpeg();

        ffmpeg.off('progress');
        ffmpeg.off('log');
        ffmpeg.on('log', ({ message }) => { logs.push(message); });
        ffmpeg.on('progress', ({ progress }) => {
          const pct = Math.min(100, Math.round(Math.max(0, progress) * 100));
          progressLabel.textContent = `Processing… ${pct}%`;
          progressFill.className = 'progress-fill';
          progressFill.style.width = `${pct}%`;
        });

        progressLabel.textContent = 'Reading file…';
        progressFill.className = 'progress-fill indeterminate';

        const { fetchFile } = await import('https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js');
        await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

        progressLabel.textContent = 'Processing…';
        progressFill.className = 'progress-fill';
        progressFill.style.width = '0%';

        const args = getSpeedArgs(inputName, outputName, speed, loops);
        const exitCode = await ffmpeg.exec(args);

        if (exitCode !== 0) {
          throw new Error(`FFmpeg failed (exit ${exitCode}). Last log:\n${logs.slice(-5).join('\n')}`);
        }

        const data = await ffmpeg.readFile(outputName);
        const blob = new Blob([data.buffer], { type: 'video/mp4' });

        await ffmpeg.deleteFile(inputName).catch(() => {});
        await ffmpeg.deleteFile(outputName).catch(() => {});

        if (downloadLink._prevURL) URL.revokeObjectURL(downloadLink._prevURL);
        const url = URL.createObjectURL(blob);
        downloadLink._prevURL = url;
        downloadLink.href = url;
        downloadLink.download = downloadName;
        downloadLink.textContent = `Download ${downloadName}`;

        progressFill.className = 'progress-fill';
        progressFill.style.width = '100%';
        await new Promise(r => setTimeout(r, 300));

        show(resultSection);
      } catch (err) {
        console.error(err);
        showError(err.message ?? 'Processing failed. See browser console for details.');
      }
    });
  </script>
</body>
</html>
