<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video to GIF Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 580px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #333;
      border-radius: 8px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #6366f1;
      background: #1e1e2e;
    }
    .drop-zone svg { opacity: 0.4; margin-bottom: 12px; }
    .drop-zone p { color: #888; font-size: 0.9rem; }
    .drop-zone span { color: #6366f1; font-weight: 600; }
    #fileInput { display: none; }

    /* Video preview */
    #previewWrap {
      display: none;
      margin-top: 20px;
    }
    #preview {
      width: 100%;
      border-radius: 8px;
      background: #000;
      max-height: 280px;
      object-fit: contain;
    }
    .filename {
      font-size: 0.8rem;
      color: #666;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Options */
    .options {
      display: none;
      margin-top: 24px;
      display: none;
      gap: 16px;
      flex-wrap: wrap;
    }
    .options.visible { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 120px;
    }
    .field label {
      font-size: 0.78rem;
      color: #888;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .field input[type="number"] {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e8e8e8;
      padding: 8px 10px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input[type="number"]:focus { border-color: #6366f1; }

    /* Convert button */
    #convertBtn {
      display: none;
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #convertBtn:hover:not(:disabled) { background: #4f46e5; }
    #convertBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #convertBtn.visible { display: block; }

    /* Progress */
    #progressWrap {
      display: none;
      margin-top: 20px;
    }
    #progressWrap.visible { display: block; }
    .progress-label {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      background: #222;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    #progressBar {
      height: 100%;
      background: #6366f1;
      border-radius: 99px;
      width: 0%;
      transition: width 0.1s;
    }

    /* Result */
    #resultWrap {
      display: none;
      margin-top: 24px;
      text-align: center;
    }
    #resultWrap.visible { display: block; }
    #gifPreview {
      width: 100%;
      border-radius: 8px;
      max-height: 280px;
      object-fit: contain;
    }
    #downloadBtn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 28px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    #downloadBtn:hover { background: #16a34a; }

    .reset-link {
      margin-top: 12px;
      display: block;
      color: #555;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .reset-link:hover { color: #888; }
  </style>
</head>
<body>
  <h1>Video to GIF</h1>
  <p class="subtitle">Convert any video clip to an animated GIF — right in your browser</p>

  <div class="card">
    <!-- Drop zone -->
    <div class="drop-zone" id="dropZone">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M15 10l4.553-2.07A1 1 0 0121 8.878V18a1 1 0 01-1.447.894L15 17M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      </svg>
      <p>Drop a video file here or <span>browse</span></p>
      <p style="margin-top:6px;font-size:0.78rem;">MP4, WebM, MOV, AVI and more</p>
      <input type="file" id="fileInput" accept="video/*">
    </div>

    <!-- Video preview -->
    <div id="previewWrap">
      <video id="preview" controls muted playsinline></video>
      <p class="filename" id="filename"></p>
    </div>

    <!-- Options -->
    <div class="options" id="options">
      <div class="field">
        <label>Start (sec)</label>
        <input type="number" id="startTime" value="0" min="0" step="0.1">
      </div>
      <div class="field">
        <label>End (sec)</label>
        <input type="number" id="endTime" value="3" min="0.1" step="0.1">
      </div>
      <div class="field">
        <label>FPS</label>
        <input type="number" id="fps" value="10" min="1" max="30" step="1">
      </div>
      <div class="field">
        <label>Width (px)</label>
        <input type="number" id="width" value="480" min="64" max="1280" step="16">
      </div>
    </div>

    <!-- Convert button -->
    <button id="convertBtn">Convert to GIF</button>

    <!-- Progress -->
    <div id="progressWrap">
      <p class="progress-label" id="progressLabel">Capturing frames…</p>
      <div class="progress-bar-bg"><div id="progressBar"></div></div>
    </div>

    <!-- Result -->
    <div id="resultWrap">
      <img id="gifPreview" alt="Generated GIF">
      <br>
      <a id="downloadBtn">Download GIF</a>
      <span class="reset-link" id="resetLink">Convert another video</span>
    </div>
  </div>

  <!-- Hidden canvas for frame capture -->
  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const previewWrap = document.getElementById('previewWrap');
    const preview    = document.getElementById('preview');
    const filenameEl = document.getElementById('filename');
    const options    = document.getElementById('options');
    const convertBtn = document.getElementById('convertBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar  = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');
    const resultWrap = document.getElementById('resultWrap');
    const gifPreview = document.getElementById('gifPreview');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetLink  = document.getElementById('resetLink');
    const canvas     = document.getElementById('canvas');
    const ctx        = canvas.getContext('2d');

    let videoFile = null;

    // Drop zone interactions
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('video/')) loadVideo(file);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadVideo(fileInput.files[0]);
    });

    function loadVideo(file) {
      videoFile = file;
      const url = URL.createObjectURL(file);
      preview.src = url;
      filenameEl.textContent = file.name;
      previewWrap.style.display = 'block';
      options.classList.add('visible');
      convertBtn.classList.add('visible');
      resultWrap.classList.remove('visible');
      progressWrap.classList.remove('visible');

      // Set sensible end time once metadata loads
      preview.addEventListener('loadedmetadata', () => {
        const dur = preview.duration;
        document.getElementById('endTime').value = Math.min(3, dur).toFixed(1);
        document.getElementById('endTime').max = dur.toFixed(1);
        document.getElementById('startTime').max = dur.toFixed(1);
      }, { once: true });
    }

    convertBtn.addEventListener('click', startConversion);

    async function startConversion() {
      const startTime = parseFloat(document.getElementById('startTime').value) || 0;
      const endTime   = parseFloat(document.getElementById('endTime').value);
      const fps       = Math.min(30, Math.max(1, parseInt(document.getElementById('fps').value) || 10));
      const outWidth  = Math.min(1280, Math.max(64, parseInt(document.getElementById('width').value) || 480));

      if (endTime <= startTime) {
        alert('End time must be greater than start time.');
        return;
      }

      convertBtn.disabled = true;
      progressWrap.classList.add('visible');
      progressBar.style.width = '0%';
      progressLabel.textContent = 'Capturing frames…';
      resultWrap.classList.remove('visible');

      const duration  = endTime - startTime;
      const frameCount = Math.round(duration * fps);
      const delay     = Math.round(1000 / fps);

      // Size canvas proportionally
      await new Promise(res => {
        if (preview.readyState >= 1) { res(); return; }
        preview.addEventListener('loadedmetadata', res, { once: true });
      });
      const ratio = preview.videoHeight / preview.videoWidth;
      const outHeight = Math.round(outWidth * ratio);
      canvas.width  = outWidth;
      canvas.height = outHeight;

      // Seek video to each frame timestamp and capture
      const gif = new GIF({
        workers: 2,
        quality: 10,
        width: outWidth,
        height: outHeight,
        workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js',
      });

      for (let i = 0; i < frameCount; i++) {
        const t = startTime + (i / frameCount) * duration;
        await seekTo(preview, t);
        ctx.drawImage(preview, 0, 0, outWidth, outHeight);
        gif.addFrame(canvas, { copy: true, delay });
        const pct = Math.round((i / frameCount) * 80);
        progressBar.style.width = pct + '%';
        progressLabel.textContent = `Capturing frames… (${i + 1}/${frameCount})`;
      }

      progressLabel.textContent = 'Encoding GIF…';

      gif.on('progress', p => {
        progressBar.style.width = (80 + Math.round(p * 20)) + '%';
      });

      gif.on('finished', blob => {
        const url = URL.createObjectURL(blob);
        gifPreview.src = url;
        downloadBtn.href = url;
        downloadBtn.download = videoFile.name.replace(/\.[^.]+$/, '') + '.gif';
        progressBar.style.width = '100%';
        progressLabel.textContent = 'Done!';
        resultWrap.classList.add('visible');
        convertBtn.disabled = false;
      });

      gif.render();
    }

    function seekTo(video, time) {
      return new Promise(resolve => {
        const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
        video.addEventListener('seeked', onSeeked);
        video.currentTime = time;
      });
    }

    resetLink.addEventListener('click', () => {
      videoFile = null;
      preview.src = '';
      fileInput.value = '';
      previewWrap.style.display = 'none';
      options.classList.remove('visible');
      convertBtn.classList.remove('visible');
      progressWrap.classList.remove('visible');
      resultWrap.classList.remove('visible');
      convertBtn.disabled = false;
    });
  </script>
</body>
</html>
